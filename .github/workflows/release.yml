# Pushing a vX.Y.Z tag runs the tests, then creates a GitHub release and publishes
# Formula/woodshed.rb to lafarguem/homebrew-tap. `gh workflow run release.yml` runs only the tests.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # On an Apple Silicon Mac with Homebrew's Python, like the installed formula. Of the models, only the
    # pitch one (181 MB) is downloaded, for the tests that rate synthetic takes; those that need the others
    # (1.7 GB) skip themselves.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg, uv, and the Python the formula uses
        run: brew install ffmpeg uv python@3.14

      - name: Keep the pitch model from one run to the next
        uses: actions/cache@v4
        with:
          # The whole cache: a model's own folder only links to its files, kept in a store all models share.
          path: ~/.cache/huggingface/hub
          key: huggingface-rmvpe

      - name: Run the tests
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          export UV_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
          uv sync --frozen
          uv run --frozen python -c "from huggingface_hub import hf_hub_download; from woodshed import rmvpe; hf_hub_download(rmvpe.HF_REPO, rmvpe.WEIGHTS)"
          uv run --frozen pytest

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')  # not when only the tests are run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Render the formula
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha=$(curl -sSfL "$url" | sha256sum | cut -d' ' -f1)
          sed -e "s|@URL@|$url|" -e "s|@SHA256@|$sha|" packaging/woodshed.rb.in > woodshed.rb
          cat woodshed.rb

      - name: Check out the tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: lafarguem/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Publish the formula
        if: env.TAP_TOKEN != ''
        run: |
          cp woodshed.rb tap/Formula/woodshed.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/woodshed.rb
          git commit -m "woodshed ${GITHUB_REF_NAME#v}"
          git push

      - name: Explain a skipped publish
        if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN isn't set on this repo, so the formula wasn't published to the tap."
