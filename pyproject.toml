[project]
name = "woodshed"
version = "0.5.3"
description = "Record your covers; Woodshed recognizes the song and files each take by date."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.1.0",
    "librosa>=0.11.0",
    "mlx-whisper>=0.4",
    "mutagen>=1.47",
    "numpy>=1.26",
    "rich>=13",
    "segno>=1.6",
    "sounddevice>=0.5",
    "typer>=0.12",
]

[project.scripts]
shed = "woodshed.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
